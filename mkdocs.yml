site_name: F1
site_description: CLI de análises de Fórmula 1 sobre a OpenF1 API, com cache local em DuckDB.
docs_dir: docs
strict: true

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Início: index.md
  - Uso da CLI: usage.md
  - Arquitetura: architecture.md
  - Desenvolvimento: development.md
  - Testes: testing.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

validation:
  links:
    not_found: warn
    anchors: warn
